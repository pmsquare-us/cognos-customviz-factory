<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <!-- Decorative outer wall: no key, not bound to data. -->
  <rect x="5" y="5" width="350" height="230" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/>

  <g data-cv-view="workspaces" title="Workspaces">
    <rect data-cv-key="Reception" x="15" y="15" width="100" height="60" fill="#dbeafe" stroke="#33475b" stroke-width="1"/>
    <text x="65" y="49" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Reception</text>
    <rect data-cv-key="Open Plan" x="15" y="85" width="160" height="140" fill="#dbeafe" stroke="#33475b" stroke-width="1"/>
    <text x="95" y="158" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Open Plan</text>
  </g>

  <g data-cv-view="meeting_rooms" title="Meeting Rooms">
    <rect data-cv-key="Meeting A" x="125" y="15" width="110" height="60" fill="#dcfce7" stroke="#33475b" stroke-width="1"/>
    <text x="180" y="49" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Meeting A</text>
    <rect data-cv-key="Meeting B" x="245" y="15" width="100" height="60" fill="#dcfce7" stroke="#33475b" stroke-width="1"/>
    <text x="295" y="49" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Meeting B</text>
  </g>

  <g data-cv-view="facilities" title="Facilities">
    <rect data-cv-key="Kitchen" x="185" y="85" width="70" height="60" fill="#fef9c3" stroke="#33475b" stroke-width="1"/>
    <text x="220" y="119" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Kitchen</text>
    <!-- L-shaped server room as a CLOSED path (ends with Z). -->
    <path data-cv-key="Server Room" d="M185,155 H255 V185 H345 V225 H185 Z" fill="#fde2e2" stroke="#33475b" stroke-width="1"/>
    <text x="265" y="212" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#33475b">Server Room</text>
  </g>
</svg>
